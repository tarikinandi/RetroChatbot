{% if demo %}
  <p class="era-toggle-form">
    {% if era == '2030' %}
      <a class="era-toggle-button" href="/?era=1996">📼 1996'YA DON</a>
    {% else %}
      <a class="era-toggle-button" href="/?era=2030">⚡ 2030'A ISINLAN</a>
    {% endif %}

{% else %}
<form method="post" action="/toggle-era" class="era-toggle-form">
  {% if era == '2030' %}
    <button type="submit" class="era-toggle-button">📼 1996'YA DON</button>
  {% else %}
    <button type="submit" class="era-toggle-button">⚡ 2030'A ISINLAN</button>
  {% endif %}
